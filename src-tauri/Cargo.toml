[package]
name = "lobby-companion"
version = "0.7.1"
description = "Companion leve de League of Legends para a seleção de campeões: runas, feitiços e conjuntos de itens com dados do lolalytics"
authors = ["nickmaglowsch"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is necessary to avoid a name clash with the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519)
name = "lobby_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# native-tls = SChannel no Windows: sem dependência C extra e aceita o certificado autoassinado do LCU
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
native-tls = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
