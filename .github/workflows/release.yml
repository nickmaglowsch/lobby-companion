name: release

# Gera o instalador (NSIS) no GitHub, onde o Smart App Control não interfere.
# - Manual (Actions → release → Run workflow): o instalador fica como artefato da execução.
# - Tag v*: também cria um rascunho de release (só publica quando você clicar em "Publish").
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: lobby-companion-instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe
