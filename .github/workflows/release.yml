name: release

# Gera os instaladores no GitHub e, com o SignPath configurado, assina o MSI (e o .exe dentro dele).
# - Manual (Actions → release → Run workflow): política "test-signing" (certificado de teste, sem aprovação)
#   para validar o fluxo; os instaladores ficam como artefato da execução.
# - Tag v*: política "release-signing" (certificado da SignPath Foundation, aprovação manual no SignPath)
#   e rascunho de release com o MSI assinado; publique o rascunho depois de conferir.
# Sem a variável SIGNPATH_ORGANIZATION_ID o fluxo continua como antes (instaladores sem assinatura).
# Passo a passo da configuração: docs/SIGNING.md
#
# Atualizador do app (tauri-plugin-updater): com o secret TAURI_SIGNING_PRIVATE_KEY, o build assina o
# instalador NSIS com a chave do updater (.sig) e a tag ganha um latest.json no rascunho de release.
# O app procura releases/latest/download/latest.json: a atualização só chega quando o rascunho é
# publicado. A chave pública está em src-tauri/tauri.conf.json (plugins.updater.pubkey).
#
# Lançamento automático: o auto-release.yml chama este workflow a cada merge na main com
# `tag` e `publish: true`. Aí, antes do build, rodam os testes; depois a release sai publicada
# (não rascunho), com as notas de .github/release-notes.md e o SHA-256 do instalador.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag já criada (vX.Y.Z); vazia = só build, sem release"
        type: string
        default: ""
      publish:
        description: "Publicar a release (senão, rascunho)"
        type: boolean
        default: false
      changes:
        description: "Novidades (lista em Markdown) para as notas"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      # Tag desta versão: a recebida do auto-release.yml ou a do push de tag (vazia = sem release).
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # No lançamento automático não houve revisão de rascunho: os mesmos testes do ci.yml antes.
      - name: Testes (lançamento automático)
        if: env.PUBLISH == 'true'
        run: npm run check
      - name: cargo test (lançamento automático)
        if: env.PUBLISH == 'true'
        working-directory: src-tauri
        run: cargo test

      - name: Tag sem a chave do atualizador
        if: env.TAG != '' && env.HAS_UPDATER_KEY != 'true'
        run: |
          echo "::error::falta o secret TAURI_SIGNING_PRIVATE_KEY: sem ele a versão não chega pelo atualizador"
          exit 1

      - name: Build (sem artefatos do atualizador)
        if: env.HAS_UPDATER_KEY != 'true'
        run: npm run tauri build

      - name: Build (com a assinatura do atualizador)
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --config src-tauri/tauri.updater.conf.json

      - name: latest.json do atualizador
        if: env.TAG != '' && env.HAS_UPDATER_KEY == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "instalador NSIS não encontrado" }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) { throw "assinatura do atualizador não encontrada: $sigFile" }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:TAG
          if ("v$version" -ne $tag) { throw "a tag $tag não bate com a versão $version do tauri.conf.json" }
          # O GitHub troca espaço por ponto no nome do arquivo da release.
          $asset = $exe.Name -replace ' ', '.'
          $manifest = [ordered]@{
            version   = $version
            notes     = "Novidades: https://github.com/${{ github.repository }}/releases/tag/$tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigFile -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          Get-Content latest.json

      - name: Cópia do instalador com nome fixo (download da landing page)
        if: env.TAG != ''
        shell: pwsh
        # releases/latest/download/LobbyCompanion-setup.exe sempre aponta para a última versão publicada.
        run: Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName LobbyCompanion-setup.exe

      - name: Envia o MSI sem assinatura (entrada do SignPath)
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: msi-sem-assinatura
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Assina no SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lobby-companion' }}
          signing-policy-slug: ${{ env.TAG != '' && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # release-signing espera a aprovação manual no SignPath
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Confere as assinaturas (MSI e arquivos dentro dele)
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $msi = Get-ChildItem signed -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "o SignPath não devolveu o MSI" }
          $x = Join-Path $env:RUNNER_TEMP "msi-extraido"
          Start-Process msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$x`"" -Wait
          # A cópia do .msi que a extração administrativa cria é alterada e perde a assinatura: só conferimos o original.
          $files = @($msi) + @(Get-ChildItem $x -Recurse -Include *.exe, *.dll)
          if ($files.Count -lt 2) { throw "nenhum executável encontrado dentro do MSI" }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} | {2}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if (-not $s.SignerCertificate) { throw "sem assinatura: $($f.FullName)" }
          }

      - name: Guarda os instaladores assinados
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: lobby-companion-instalador-assinado
          path: signed/**/*.msi
          if-no-files-found: error

      - name: Guarda os instaladores sem assinatura
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: lobby-companion-instalador
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Notas da release (lançamento automático)
        if: env.TAG != '' && env.PUBLISH == 'true'
        shell: pwsh
        env:
          CHANGES: ${{ inputs.changes }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $changes = if ("$env:CHANGES".Trim()) { "$env:CHANGES".Trim() } else { "- Correções e melhorias internas." }
          $notes = Get-Content .github/release-notes.md -Raw -Encoding utf8
          $values = [ordered]@{
            "{{VERSION}}" = $env:TAG.TrimStart("v")
            "{{CHANGES}}" = $changes
            "{{EXE}}"     = $exe.Name -replace ' ', '.'
            "{{SHA}}"     = $sha
            "{{RUN_ID}}"  = "${{ github.run_id }}"
            "{{RUN_URL}}" = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "{{COMMIT}}"  = (git rev-parse --short HEAD)
          }
          foreach ($k in $values.Keys) { $notes = $notes.Replace($k, $values[$k]) }
          Set-Content release-notes.md $notes -Encoding utf8NoBOM
          Get-Content release-notes.md

      - name: Rascunho de release (MSI assinado)
        if: env.TAG != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: ${{ env.PUBLISH != 'true' }}
          body_path: ${{ env.PUBLISH == 'true' && 'release-notes.md' || '' }}
          make_latest: ${{ env.PUBLISH == 'true' && 'true' || 'legacy' }}
          files: signed/**/*.msi

      - name: Release (sem assinatura; publicada no lançamento automático, rascunho na tag à mão)
        if: env.TAG != '' && vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: ${{ env.PUBLISH != 'true' }}
          body_path: ${{ env.PUBLISH == 'true' && 'release-notes.md' || '' }}
          make_latest: ${{ env.PUBLISH == 'true' && 'true' || 'legacy' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            latest.json
            LobbyCompanion-setup.exe
